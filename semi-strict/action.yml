name: 'Docker Publish (semi-strict Semgrep + Trivy gate)'
description: 'SAST - Build - Scan - Push Docker image. Gate on all Trivy severities (UNKNOWN to CRITICAL) and on Semgrep WARNING/ERROR'
author: 'abxst (Nguyen Hai)'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  registry:
    required: false
    default: 'ghcr.io'
  image-name:
    required: false
    default: ${{ github.repository }}
  context:
    required: false
    default: '.'
  dockerfile:
    required: false
    default: './Dockerfile'
  push:
    required: false
    default: 'false'
  registry-username:
    required: true
  registry-password:
    required: true
  tags:
    required: false
    default: |
      type=raw,value={{sha}}-{{date 'DDMMYYYY'}},enable={{is_default_branch}}
      type=raw,value=latest,enable={{is_default_branch}}
  build-args:
    required: false
    default: ''
  platforms:
    required: false
    default: 'linux/amd64'
  scan-platform:
    required: false
    default: 'linux/amd64'
  gate-severity:
    required: false
    default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
  gate-ignore-unfixed:
    required: false
    default: 'true'
  sast-config:
    required: false
    default: 'p/default'
  sast-gate-severity:
    required: false
    default: 'WARNING,ERROR'
  sast-exclude:
    required: false
    default: ''
  semgrep-version:
    required: false
    default: 'latest'
  report-artifact-name:
    required: false
    default: 'security-reports'
  report-retention-days:
    required: false
    default: '90'

outputs:
  image-tags:
    value: ${{ steps.meta.outputs.tags }}
  image-digest:
    value: ${{ steps.push.outputs.digest }}
  image-name-lc:
    value: ${{ steps.lc.outputs.name }}
  sast-report:
    value: ${{ steps.reports.outputs.sast }}
  image-report:
    value: ${{ steps.reports.outputs.image }}

runs:
  using: 'composite'
  steps:
    - name: Report paths
      id: reports
      shell: bash
      run: |
        {
          echo "sast=$RUNNER_TEMP/semgrep-report.json"
          echo "image=$RUNNER_TEMP/trivy-report.json"
        } >> "$GITHUB_OUTPUT"

    - name: Semgrep SAST scan
      shell: bash
      env:
        SAST_CONFIG: ${{ inputs.sast-config }}
        SAST_EXCLUDE: ${{ inputs.sast-exclude }}
        SEMGREP_IMAGE: 'semgrep/semgrep:${{ inputs.semgrep-version }}'
        OUT: ${{ steps.reports.outputs.sast }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r c; do
          c="${c// /}"
          if [ -n "$c" ]; then args+=(--config "$c"); fi
        done <<< "${SAST_CONFIG//,/$'\n'}"
        while IFS= read -r e; do
          if [ -n "$e" ]; then args+=(--exclude "$e"); fi
        done <<< "${SAST_EXCLUDE//,/$'\n'}"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:/src" \
          -v "$RUNNER_TEMP:/out" \
          -w /src "$SEMGREP_IMAGE" \
          semgrep scan "${args[@]}" \
            --metrics=off --disable-version-check \
            --json --output "/out/$(basename "$OUT")" . || true

    - name: Semgrep gate
      shell: bash
      env:
        OUT: ${{ steps.reports.outputs.sast }}
        GATE_SEVERITY: ${{ inputs.sast-gate-severity }}
      run: |
        set -euo pipefail
        if [ ! -f "$OUT" ]; then
          echo "::error::Semgrep produced no report at $OUT - the scan did not complete."
          exit 1
        fi
        sev=$(jq -cn --arg s "$GATE_SEVERITY" \
          '$s | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
        blocking=$(jq -c --argjson sev "$sev" \
          '[.results[] | select(.extra.severity as $s | $sev | index($s))]' "$OUT")
        total=$(jq '.results | length' "$OUT")
        count=$(jq 'length' <<< "$blocking")
        echo "Semgrep: $total finding(s) total, $count blocking (gate: $GATE_SEVERITY)"
        jq -r 'group_by(.extra.severity)[] | "  \(.[0].extra.severity): \(length)"' <<< "$blocking"
        jq -r '.[] | "  [\(.extra.severity)] \(.check_id)\n      \(.path):\(.start.line)"' <<< "$blocking"
        if [ "$count" -gt 0 ]; then
          echo "::error::Semgrep gate failed: $count blocking finding(s)."
          exit 1
        fi

    - name: Lowercase image name
      id: lc
      shell: bash
      env:
        RAW_NAME: ${{ inputs.image-name }}
      run: echo "name=${RAW_NAME,,}" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ steps.lc.outputs.name }}
        tags: ${{ inputs.tags }}

    - name: Build (local for scan)
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        load: true
        tags: ${{ steps.lc.outputs.name }}:scan
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        platforms: ${{ inputs.scan-platform }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Trivy image scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.lc.outputs.name }}:scan
        format: json
        output: ${{ steps.reports.outputs.image }}
        cache-dir: ${{ runner.temp }}/trivy-cache
        exit-code: '0'
        ignore-unfixed: false
        vuln-type: os,library
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

    - name: Trivy gate
      shell: bash
      env:
        OUT: ${{ steps.reports.outputs.image }}
        GATE_SEVERITY: ${{ inputs.gate-severity }}
        IGNORE_UNFIXED: ${{ inputs.gate-ignore-unfixed }}
      run: |
        set -euo pipefail
        if [ ! -f "$OUT" ]; then
          echo "::error::Trivy produced no report at $OUT - the scan did not complete."
          exit 1
        fi
        sev=$(jq -cn --arg s "$GATE_SEVERITY" \
          '$s | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
        blocking=$(jq -c --argjson sev "$sev" --arg unfixed "$IGNORE_UNFIXED" '
          [ .Results[]?.Vulnerabilities[]?
            | select(.Severity as $s | $sev | index($s))
            | select($unfixed != "true" or ((.FixedVersion // "") != ""))
          ]' "$OUT")
        total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$OUT")
        count=$(jq 'length' <<< "$blocking")
        echo "Trivy: $total vulnerability(ies) total, $count blocking (gate: $GATE_SEVERITY, ignore-unfixed: $IGNORE_UNFIXED)"
        jq -r 'group_by(.Severity)[] | "  \(.[0].Severity): \(length)"' <<< "$blocking"
        jq -r '.[] | "  [\(.Severity)] \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(if (.FixedVersion // "") == "" then "no fix" else .FixedVersion end)"' <<< "$blocking"
        if [ "$count" -gt 0 ]; then
          echo "::error::Trivy gate failed: $count blocking vulnerability(ies)."
          exit 1
        fi

    - name: Upload security reports
      if: always() && inputs.report-artifact-name != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-artifact-name }}
        path: |
          ${{ steps.reports.outputs.sast }}
          ${{ steps.reports.outputs.image }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.report-retention-days }}

    - name: Push
      id: push
      if: inputs.push == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        platforms: ${{ inputs.platforms }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
