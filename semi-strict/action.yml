name: 'Docker Publish (semi-strict Semgrep + Trivy gate)'
description: 'SAST - Build - Scan - Push Docker image. Gate on all Trivy severities (UNKNOWN to CRITICAL) and on Semgrep WARNING/ERROR'
author: 'abxst (Nguyen Hai)'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  registry:
    required: false
    default: 'ghcr.io'
  image-name:
    required: false
    default: ${{ github.repository }}
  context:
    required: false
    default: '.'
  dockerfile:
    required: false
    default: './Dockerfile'
  push:
    required: false
    default: 'false'
  registry-username:
    required: true
  registry-password:
    required: true
  tags:
    required: false
    default: |
      type=raw,value={{sha}}-{{date 'DDMMYYYY'}},enable={{is_default_branch}}
      type=raw,value=latest,enable={{is_default_branch}}
  build-args:
    required: false
    default: ''
  platforms:
    required: false
    default: 'linux/amd64'
  scan-platform:
    required: false
    default: 'linux/amd64'
  gate-severity:
    required: false
    default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
  gate-ignore-unfixed:
    required: false
    default: 'true'
  sast-config:
    required: false
    default: 'p/default'
  sast-gate-severity:
    required: false
    default: 'WARNING,ERROR'
  sast-exclude:
    required: false
    default: ''
  semgrep-version:
    required: false
    default: 'latest'
  sarif-upload:
    required: false
    default: 'true'

outputs:
  image-tags:
    value: ${{ steps.meta.outputs.tags }}
  image-digest:
    value: ${{ steps.push.outputs.digest }}
  image-name-lc:
    value: ${{ steps.lc.outputs.name }}
  sast-sarif:
    value: ${{ steps.reports.outputs.sast }}
  sast-gate-report:
    value: ${{ steps.reports.outputs.sast-gate }}
  image-sarif:
    value: ${{ steps.reports.outputs.image }}
  image-gate-report:
    value: ${{ steps.reports.outputs.image-gate }}

runs:
  using: 'composite'
  steps:
    - name: Report paths
      id: reports
      shell: bash
      run: |
        {
          echo "sast=$RUNNER_TEMP/semgrep.sarif"
          echo "sast-gate=$RUNNER_TEMP/semgrep-gate.json"
          echo "image=$RUNNER_TEMP/trivy.sarif"
          echo "image-gate=$RUNNER_TEMP/trivy-gate.json"
        } >> "$GITHUB_OUTPUT"

    - name: Semgrep SAST (full report)
      shell: bash
      env:
        SAST_CONFIG: ${{ inputs.sast-config }}
        SAST_EXCLUDE: ${{ inputs.sast-exclude }}
        SEMGREP_IMAGE: 'semgrep/semgrep:${{ inputs.semgrep-version }}'
        OUT: ${{ steps.reports.outputs.sast }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r c; do
          c="${c// /}"
          if [ -n "$c" ]; then args+=(--config "$c"); fi
        done <<< "${SAST_CONFIG//,/$'\n'}"
        while IFS= read -r e; do
          if [ -n "$e" ]; then args+=(--exclude "$e"); fi
        done <<< "${SAST_EXCLUDE//,/$'\n'}"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:/src" \
          -v "$RUNNER_TEMP:/out" \
          -w /src "$SEMGREP_IMAGE" \
          semgrep scan "${args[@]}" \
            --metrics=off --disable-version-check \
            --sarif --output "/out/$(basename "$OUT")" . || true

    - name: Upload Semgrep SARIF
      if: always() && inputs.sarif-upload == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.reports.outputs.sast }}
        category: semgrep

    - name: Semgrep SAST (hard gate)
      shell: bash
      env:
        SAST_CONFIG: ${{ inputs.sast-config }}
        SAST_EXCLUDE: ${{ inputs.sast-exclude }}
        SAST_GATE_SEVERITY: ${{ inputs.sast-gate-severity }}
        SEMGREP_IMAGE: 'semgrep/semgrep:${{ inputs.semgrep-version }}'
        OUT: ${{ steps.reports.outputs.sast-gate }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r c; do
          c="${c// /}"
          if [ -n "$c" ]; then args+=(--config "$c"); fi
        done <<< "${SAST_CONFIG//,/$'\n'}"
        while IFS= read -r e; do
          if [ -n "$e" ]; then args+=(--exclude "$e"); fi
        done <<< "${SAST_EXCLUDE//,/$'\n'}"
        while IFS= read -r s; do
          s="${s// /}"
          if [ -n "$s" ]; then args+=(--severity "$s"); fi
        done <<< "${SAST_GATE_SEVERITY//,/$'\n'}"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:/src" \
          -v "$RUNNER_TEMP:/out" \
          -w /src "$SEMGREP_IMAGE" \
          semgrep scan "${args[@]}" \
            --metrics=off --disable-version-check \
            --json --output "/out/$(basename "$OUT")" --error .

    - name: Semgrep gate summary
      if: always()
      shell: bash
      env:
        OUT: ${{ steps.reports.outputs.sast-gate }}
      run: |
        set -euo pipefail
        if [ ! -f "$OUT" ]; then
          echo "No Semgrep gate report at $OUT (scan did not complete)."
          exit 0
        fi
        jq -r '
          "Semgrep gate: \(.results | length) blocking finding(s)",
          (.results | group_by(.extra.severity)[] | "  \(.[0].extra.severity): \(length)"),
          (.results[] | "  [\(.extra.severity)] \(.check_id)\n      \(.path):\(.start.line)")
        ' "$OUT"

    - name: Lowercase image name
      id: lc
      shell: bash
      env:
        RAW_NAME: ${{ inputs.image-name }}
      run: echo "name=${RAW_NAME,,}" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ steps.lc.outputs.name }}
        tags: ${{ inputs.tags }}

    - name: Build (local for scan)
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        load: true
        tags: ${{ steps.lc.outputs.name }}:scan
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        platforms: ${{ inputs.scan-platform }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Trivy scan (full report)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.lc.outputs.name }}:scan
        format: sarif
        output: ${{ steps.reports.outputs.image }}
        cache-dir: ${{ runner.temp }}/trivy-cache
        exit-code: '0'
        ignore-unfixed: false
        vuln-type: os,library
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

    - name: Upload Trivy SARIF
      if: always() && inputs.sarif-upload == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.reports.outputs.image }}
        category: trivy

    - name: Trivy scan (hard gate)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.lc.outputs.name }}:scan
        format: json
        output: ${{ steps.reports.outputs.image-gate }}
        cache-dir: ${{ runner.temp }}/trivy-cache
        exit-code: '1'
        ignore-unfixed: ${{ inputs.gate-ignore-unfixed }}
        vuln-type: os,library
        severity: ${{ inputs.gate-severity }}

    - name: Trivy gate summary
      if: always()
      shell: bash
      env:
        OUT: ${{ steps.reports.outputs.image-gate }}
      run: |
        set -euo pipefail
        if [ ! -f "$OUT" ]; then
          echo "No Trivy gate report at $OUT (scan did not complete)."
          exit 0
        fi
        jq -r '
          ([.Results[]?.Vulnerabilities[]?]) as $v
          | "Trivy gate: \($v | length) blocking vulnerability(ies)",
            ($v | group_by(.Severity)[] | "  \(.[0].Severity): \(length)"),
            ($v[] | "  [\(.Severity)] \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")")
        ' "$OUT"

    - name: Push
      id: push
      if: inputs.push == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        platforms: ${{ inputs.platforms }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
