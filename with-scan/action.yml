name: 'Docker Publish (with Semgrep + Trivy scan)'
description: 'SAST - Build - Scan - Publish scanned amd64 Docker image'
author: 'abxst (Nguyen Hai)'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  registry:
    required: false
    default: 'ghcr.io'
  image-name:
    required: false
    default: ${{ github.repository }}
  context:
    required: false
    default: '.'
  dockerfile:
    required: false
    default: './Dockerfile'
  push:
    required: false
    default: 'false'
  registry-username:
    required: true
  registry-password:
    required: true
  tags:
    required: false
    default: |
      type=raw,value={{sha}}-{{date 'DDMMYYYY'}},enable={{is_default_branch}}
      type=raw,value=latest,enable={{is_default_branch}}
  build-args:
    required: false
    default: ''
  gate-severity:
    required: false
    default: 'HIGH,CRITICAL'
  gate-ignore-unfixed:
    required: false
    default: 'true'
  sast-config:
    required: false
    default: 'p/default'
  sast-gate-severity:
    required: false
    default: 'ERROR'
  sast-exclude:
    required: false
    default: ''
  semgrep-version:
    required: false
    default: 'latest'
  report-artifact-name:
    required: false
    default: 'security-reports'
  report-retention-days:
    required: false
    default: '90'

outputs:
  image-tags:
    value: ${{ steps.meta.outputs.tags }}
  image-digest:
    value: ${{ steps.push.outputs.digest }}
  image-name-lc:
    value: ${{ steps.lc.outputs.name }}
  sast-report:
    value: ${{ steps.reports.outputs.sast }}
  image-report:
    value: ${{ steps.reports.outputs.image }}

runs:
  using: 'composite'
  steps:
    - name: Report paths
      id: reports
      shell: bash
      run: |
        {
          echo "sast=$RUNNER_TEMP/semgrep-report.json"
          echo "image=$RUNNER_TEMP/trivy-report.json"
        } >> "$GITHUB_OUTPUT"

    - name: Semgrep SAST scan
      shell: bash
      env:
        SAST_CONFIG: ${{ inputs.sast-config }}
        SAST_EXCLUDE: ${{ inputs.sast-exclude }}
        SEMGREP_IMAGE: 'semgrep/semgrep:${{ inputs.semgrep-version }}'
        OUT: ${{ steps.reports.outputs.sast }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r c; do
          c="${c// /}"
          if [ -n "$c" ]; then args+=(--config "$c"); fi
        done <<< "${SAST_CONFIG//,/$'\n'}"
        while IFS= read -r e; do
          if [ -n "$e" ]; then args+=(--exclude "$e"); fi
        done <<< "${SAST_EXCLUDE//,/$'\n'}"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:/src" \
          -v "$RUNNER_TEMP:/out" \
          -w /src "$SEMGREP_IMAGE" \
          semgrep scan "${args[@]}" \
            --metrics=off --disable-version-check \
            --json --output "/out/$(basename "$OUT")" . || true

    - name: Semgrep gate
      shell: bash
      env:
        OUT: ${{ steps.reports.outputs.sast }}
        GATE_SEVERITY: ${{ inputs.sast-gate-severity }}
      run: |
        set -euo pipefail
        if [ ! -f "$OUT" ]; then
          echo "::error::Semgrep produced no report at $OUT - the scan did not complete."
          exit 1
        fi
        sev=$(jq -cn --arg s "$GATE_SEVERITY" \
          '$s | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
        blocking=$(jq -c --argjson sev "$sev" \
          '[.results[] | select(.extra.severity as $s | $sev | index($s))]' "$OUT")
        total=$(jq '.results | length' "$OUT")
        count=$(jq 'length' <<< "$blocking")
        echo "Semgrep: $total finding(s) total, $count blocking (gate: $GATE_SEVERITY)"
        jq -r 'group_by(.extra.severity)[] | "  \(.[0].extra.severity): \(length)"' <<< "$blocking"
        jq -r '.[] | "  [\(.extra.severity)] \(.check_id)\n      \(.path):\(.start.line)"' <<< "$blocking"
        if [ "$count" -gt 0 ]; then
          echo "::error::Semgrep gate failed: $count blocking finding(s)."
          exit 1
        fi

    - name: Lowercase image name
      id: lc
      shell: bash
      env:
        RAW_NAME: ${{ inputs.image-name }}
      run: echo "name=${RAW_NAME,,}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to registry
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ steps.lc.outputs.name }}
        tags: ${{ inputs.tags }}

    - name: Build image once (linux/amd64)
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        load: true
        push: false
        tags: ${{ inputs.registry }}/${{ steps.lc.outputs.name }}:scan
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Validate image architecture
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.registry }}/${{ steps.lc.outputs.name }}:scan
      run: |
        set -euo pipefail
        actual=$(docker image inspect "$SOURCE_IMAGE" --format '{{.Os}}/{{.Architecture}}')
        if [[ "$actual" != 'linux/amd64' ]]; then
          echo "::error::Expected linux/amd64 but got $actual"
          exit 1
        fi
        echo "Validated $SOURCE_IMAGE ($actual)"

    - name: Trivy image scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ inputs.registry }}/${{ steps.lc.outputs.name }}:scan
        format: json
        output: ${{ steps.reports.outputs.image }}
        cache-dir: ${{ runner.temp }}/trivy-cache
        exit-code: '0'
        ignore-unfixed: false
        vuln-type: os,library
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

    - name: Trivy gate
      shell: bash
      env:
        OUT: ${{ steps.reports.outputs.image }}
        GATE_SEVERITY: ${{ inputs.gate-severity }}
        IGNORE_UNFIXED: ${{ inputs.gate-ignore-unfixed }}
      run: |
        set -euo pipefail
        if [ ! -f "$OUT" ]; then
          echo "::error::Trivy produced no report at $OUT - the scan did not complete."
          exit 1
        fi
        sev=$(jq -cn --arg s "$GATE_SEVERITY" \
          '$s | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
        blocking=$(jq -c --argjson sev "$sev" --arg unfixed "$IGNORE_UNFIXED" '
          [ .Results[]?.Vulnerabilities[]?
            | select(.Severity as $s | $sev | index($s))
            | select($unfixed != "true" or ((.FixedVersion // "") != ""))
          ]' "$OUT")
        total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$OUT")
        count=$(jq 'length' <<< "$blocking")
        echo "Trivy: $total vulnerability(ies) total, $count blocking (gate: $GATE_SEVERITY, ignore-unfixed: $IGNORE_UNFIXED)"
        jq -r 'group_by(.Severity)[] | "  \(.[0].Severity): \(length)"' <<< "$blocking"
        jq -r '.[] | "  [\(.Severity)] \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(if (.FixedVersion // "") == "" then "no fix" else .FixedVersion end)"' <<< "$blocking"
        if [ "$count" -gt 0 ]; then
          echo "::error::Trivy gate failed: $count blocking vulnerability(ies)."
          exit 1
        fi

    - name: Upload security reports
      if: always() && inputs.report-artifact-name != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-artifact-name }}
        path: |
          ${{ steps.reports.outputs.sast }}
          ${{ steps.reports.outputs.image }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.report-retention-days }}

    - name: Publish scanned image (no rebuild)
      id: push
      if: inputs.push == 'true'
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.registry }}/${{ steps.lc.outputs.name }}:scan
        IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -euo pipefail
        source_id=$(docker image inspect "$SOURCE_IMAGE" --format '{{.Id}}')
        first_digest=''
        pushed=0

        while IFS= read -r target; do
          [[ -z "$target" ]] && continue
          docker tag "$SOURCE_IMAGE" "$target"
          target_id=$(docker image inspect "$target" --format '{{.Id}}')
          if [[ "$source_id" != "$target_id" ]]; then
            echo "::error::Image ID changed during tagging: $target"
            exit 1
          fi

          log_file=$(mktemp)
          if ! docker push "$target" 2>&1 | tee "$log_file"; then
            rm -f "$log_file"
            exit 1
          fi
          digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]*\).*/\1/p' "$log_file" | tail -n 1)
          rm -f "$log_file"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not determine pushed digest for $target"
            exit 1
          fi
          if [[ -z "$first_digest" ]]; then
            first_digest="$digest"
          elif [[ "$digest" != "$first_digest" ]]; then
            echo "::error::Published tags have different digests"
            exit 1
          fi
          pushed=$((pushed + 1))
        done <<< "$IMAGE_TAGS"

        if [[ "$pushed" -eq 0 ]]; then
          echo "::error::No image tags were generated for publication"
          exit 1
        fi
        echo "digest=$first_digest" >> "$GITHUB_OUTPUT"
